<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 MAO安全钱包配置</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 700px; 
            margin: 50px auto; 
            padding: 30px; 
            background: linear-gradient(135deg, #1a1a2e, #16213e); 
            color: white; 
            min-height: 100vh;
        }
        .config-box { 
            background: rgba(22, 33, 62, 0.8); 
            padding: 25px; 
            border-radius: 15px; 
            margin: 25px 0; 
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        button { 
            background: linear-gradient(135deg, #1e40af, #2563eb); 
            color: white; 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px;
            font-weight: 600;
            margin: 8px;
            transition: all 0.3s ease;
        }
        button:hover { 
            background: linear-gradient(135deg, #1e40af, #3b82f6); 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .success { color: #10b981; font-weight: bold; }
        .warning { color: #f59e0b; font-weight: bold; }
        .error { color: #ef4444; font-weight: bold; }
        .info { color: #06b6d4; font-weight: bold; }
        h1 { text-align: center; color: #60a5fa; margin-bottom: 30px; }
        h3 { color: #93c5fd; }
        .wallet-address { 
            font-family: 'Monaco', 'Menlo', monospace; 
            background: rgba(15, 52, 96, 0.6); 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #1e40af;
            word-break: break-all;
        }
        .status-active { 
            background: rgba(16, 185, 129, 0.1); 
            border: 1px solid #10b981; 
        }
        .instruction {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid #06b6d4;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <h1>🔐 MAO安全钱包配置中心</h1>
    
    <div class="config-box">
        <h3>📝 当前配置信息</h3>
        <p><strong>🔐 主钱包地址:</strong></p>
        <div class="wallet-address">0xd0dC6Ff0eA6a27a0a4Ba0002F019d0E1b9666c28</div>
        <br>
        <p><strong>🏦 多重签名钱包:</strong> <span style="color: #f59e0b;">待配置 (可选)</span></p>
        <p><strong>⏰ 时间锁控制器:</strong> <span style="color: #f59e0b;">待配置 (可选)</span></p>
        <p><strong>🛡️ 当前安全等级:</strong> <span style="color: #10b981;">MEDIUM (基础保护已启用)</span></p>
    </div>
    
    <div class="config-box">
        <h3>🚀 钱包配置操作</h3>
        <button onclick="configureSecureWallet()">🔐 配置安全钱包</button>
        <button onclick="verifyConfig()">🔍 验证配置</button>
        <button onclick="showConfigInfo()">📖 查看配置详情</button>
        <button onclick="clearConfig()">🗑️ 清除配置</button>
    </div>
    
    <div id="status" class="config-box">
        <p class="info">📋 状态：等待配置钱包地址...</p>
    </div>

    <div class="config-box instruction">
        <h3>💡 使用说明</h3>
        <ol>
            <li>点击 <strong>"🔐 配置安全钱包"</strong> 按钮</li>
            <li>点击 <strong>"🔍 验证配置"</strong> 确认成功</li>
            <li>配置完成后，关闭此页面即可使用游戏</li>
            <li>配置信息会安全保存在浏览器本地存储中</li>
        </ol>
    </div>

    <script>
        // 🔐 安全配置管理器
        class SecureConfigManager {
            constructor() {
                this.encryptionKey = this.getOrCreateKey();
                this.walletAddress = '0xd0dC6Ff0eA6a27a0a4Ba0002F019d0E1b9666c28';
            }
            
            getOrCreateKey() {
                let key = localStorage.getItem('mao_secure_encryption_key');
                if (!key) {
                    // 生成更强的加密密钥
                    key = this.generateSecureKey();
                    localStorage.setItem('mao_secure_encryption_key', key);
                }
                return key;
            }

            generateSecureKey() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < 32; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }
            
            encrypt(text) {
                try {
                    const data = {
                        data: text,
                        timestamp: Date.now(),
                        key: this.encryptionKey
                    };
                    return btoa(JSON.stringify(data));
                } catch (error) {
                    console.error('加密失败:', error);
                    return null;
                }
            }
            
            decrypt(encryptedText) {
                try {
                    const obj = JSON.parse(atob(encryptedText));
                    return obj.key === this.encryptionKey ? obj.data : null;
                } catch (error) {
                    console.error('解密失败:', error);
                    return null;
                }
            }
            
            setSecureConfig(key, value) {
                const encrypted = this.encrypt(value);
                if (encrypted) {
                    localStorage.setItem('mao_secure_' + key, encrypted);
                    return true;
                }
                return false;
            }
            
            getSecureConfig(key) {
                const encrypted = localStorage.getItem('mao_secure_' + key);
                return encrypted ? this.decrypt(encrypted) : null;
            }

            clearSecureConfig(key) {
                localStorage.removeItem('mao_secure_' + key);
            }
        }
        
        const configManager = new SecureConfigManager();
        
        function configureSecureWallet() {
            try {
                updateStatus('⏳ 正在配置安全钱包...', 'info');
                
                // 配置主钱包地址
                const success = configManager.setSecureConfig('WALLET_ADDRESS', configManager.walletAddress);
                
                if (success) {
                    // 设置配置标记
                    configManager.setSecureConfig('CONFIG_STATUS', 'CONFIGURED');
                    configManager.setSecureConfig('CONFIG_TIME', new Date().toISOString());
                    
                    updateStatus('✅ 安全钱包配置成功！地址已安全加密存储', 'success');
                    
                    // 显示成功信息
                    setTimeout(() => {
                        updateStatus(`🎉 配置完成！<br>
                        ✅ 主钱包: ${configManager.walletAddress.slice(0,6)}...${configManager.walletAddress.slice(-4)}<br>
                        ✅ 加密存储: 已启用<br>
                        ✅ 安全等级: MEDIUM<br>
                        💡 现在可以安全使用MAO游戏了！`, 'success');
                    }, 1000);
                } else {
                    updateStatus('❌ 配置失败: 无法加密存储配置', 'error');
                }
            } catch (error) {
                updateStatus('❌ 配置失败: ' + error.message, 'error');
            }
        }
        
        function verifyConfig() {
            try {
                updateStatus('🔍 正在验证配置...', 'info');
                
                const wallet = configManager.getSecureConfig('WALLET_ADDRESS');
                const status = configManager.getSecureConfig('CONFIG_STATUS');
                const configTime = configManager.getSecureConfig('CONFIG_TIME');
                
                if (wallet && status === 'CONFIGURED') {
                    updateStatus(`✅ 配置验证成功！<br>
                    🔐 主钱包: ${wallet.slice(0,6)}...${wallet.slice(-4)}<br>
                    ⏰ 配置时间: ${new Date(configTime).toLocaleString()}<br>
                    🛡️ 安全状态: 已激活<br>
                    🎮 可以开始安全游戏了！`, 'success');
                } else {
                    updateStatus('⚠️ 配置验证失败，请先点击"配置安全钱包"', 'warning');
                }
            } catch (error) {
                updateStatus('❌ 验证失败: ' + error.message, 'error');
            }
        }

        function showConfigInfo() {
            const wallet = configManager.getSecureConfig('WALLET_ADDRESS');
            const status = configManager.getSecureConfig('CONFIG_STATUS');
            
            if (wallet && status === 'CONFIGURED') {
                updateStatus(`📖 配置详情<br>
                🔐 钱包地址: ${wallet}<br>
                🛡️ 加密状态: 已启用<br>
                🔒 存储方式: 本地加密存储<br>
                🚨 黑名单保护: 已启用<br>
                ⏰ 区块确认: 6个确认<br>
                🔧 RPC节点: 多节点保护<br>
                📊 安全等级: MEDIUM (50/135)`, 'info');
            } else {
                updateStatus('📖 当前无配置信息，请先配置安全钱包', 'warning');
            }
        }
        
        function clearConfig() {
            if (confirm('确定要清除所有安全配置吗？清除后需要重新配置。')) {
                configManager.clearSecureConfig('WALLET_ADDRESS');
                configManager.clearSecureConfig('CONFIG_STATUS');
                configManager.clearSecureConfig('CONFIG_TIME');
                updateStatus('🗑️ 安全配置已清除，请重新配置', 'warning');
            }
        }
        
        function updateStatus(message, type) {
            const statusEl = document.getElementById('status');
            const typeClass = type || 'info';
            statusEl.innerHTML = `<p class="${typeClass}">${message}</p>`;
            
            // 添加状态样式
            statusEl.className = 'config-box';
            if (type === 'success') {
                statusEl.classList.add('status-active');
            }
        }

        // 页面加载时检查配置状态
        window.addEventListener('load', function() {
            const wallet = configManager.getSecureConfig('WALLET_ADDRESS');
            const status = configManager.getSecureConfig('CONFIG_STATUS');
            
            if (wallet && status === 'CONFIGURED') {
                updateStatus(`🎯 安全钱包已配置<br>
                地址: ${wallet.slice(0,6)}...${wallet.slice(-4)}<br>
                可以直接验证或开始使用游戏`, 'success');
            } else {
                updateStatus('📋 欢迎使用MAO安全配置中心！请点击"配置安全钱包"开始', 'info');
            }
        });
    </script>
</body>
</html>
