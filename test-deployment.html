<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部署测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .status {
            background: #27ae60;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 18px;
        }
        
        .link {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            margin: 10px;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .link:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 部署测试页面</h1>
        
        <div class="status">
            ✅ GitHub Pages部署测试 - 2024年7月28日
        </div>
        
        <p>如果您能看到这个页面，说明GitHub Pages部署正常工作。</p>
        
        <div style="margin: 20px 0;">
            <a href="game-production.html" class="link">🎲 测试主游戏</a>
            <a href="index.html" class="link">🏠 返回主页</a>
        </div>
        
        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin: 20px 0; text-align: left;">
            <h3>📊 测试信息：</h3>
            <p><strong>测试时间：</strong> 2024年7月28日</p>
            <p><strong>部署状态：</strong> 测试中</p>
            <p><strong>分支：</strong> gh-pages</p>
            <p><strong>文件：</strong> test-deployment.html</p>
        </div>
        
        <p style="margin-top: 30px; color: #7f8c8d; font-size: 14px;">
            🎉 如果这个页面正常显示，说明部署成功！
        </p>
    </div>
</body>
</html>
