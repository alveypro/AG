<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 MAO游戏超级简单部署</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .deploy-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            width: 100%;
            margin: 20px 0;
        }
        .deploy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
        }
        .status {
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: bold;
            font-size: 16px;
        }
        .status.waiting {
            background: rgba(255, 193, 7, 0.3);
            border: 2px solid #FFC107;
        }
        .status.success {
            background: rgba(76, 175, 80, 0.3);
            border: 2px solid #4CAF50;
        }
        .status.error {
            background: rgba(244, 67, 54, 0.3);
            border: 2px solid #f44336;
        }
        .result {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            border: 1px solid rgba(255,255,255,0.3);
            font-size: 14px;
            text-align: left;
        }
        .copy-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .instructions {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            font-size: 16px;
            line-height: 1.6;
        }
        .params-box {
            background: rgba(0,0,0,0.4);
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            word-break: break-all;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 MAO游戏超级简单部署</h1>
        
        <div class="instructions">
            <strong>📱 3步完成部署：</strong><br>
            1. 点击下方按钮打开Remix<br>
            2. 复制部署参数<br>
            3. 在Remix中部署合约
        </div>
        
        <div class="status waiting" id="status">
            准备部署 - 点击下方按钮开始
        </div>
        
        <button class="deploy-btn" onclick="startDeploy()" id="deployBtn">
            🚀 开始部署MAO游戏合约
        </button>
        
        <div class="result" id="result" style="display: none;"></div>
    </div>

    <script>
        // 合约配置
        const CONFIG = {
            trustedOwner: "0xd0dC6Ff0eA6a27a0a4Ba0002F019d0E1b9666c28",
            admins: [
                "0xd0dC6Ff0eA6a27a0a4Ba0002F019d0E1b9666c28",
                "0x4f05108dEF45CdE35Bc38F73B6a95C74b96a16E7",
                "0x8300b4276Ac4DBbB8e73C0E99E4179D594b71eB5",
                "0x24c8fE3a662C58c6Ae589A9Aca8060B4741a24a5",
                "0x64294e2f66AB7221ecC8FAeF418cdA75E215A053"
            ],
            maoToken: "0x22f49bcb3dad370a9268ba3fca33cb037ca3d022",
            piToken: "0xfd4680e25e05b3435c7f698668d1ce80d2a9f444"
        };

        function startDeploy() {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const deployBtn = document.getElementById('deployBtn');
            
            statusDiv.className = 'status success';
            statusDiv.textContent = '✅ 部署准备完成！';
            
            // 生成部署参数
            const deployParams = `"${CONFIG.maoToken}","${CONFIG.piToken}",[${CONFIG.admins.map(addr => `"${addr}"`).join(',')}],"${CONFIG.trustedOwner}"`;
            
            // 显示结果
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
🎉 部署准备完成！

📋 部署步骤：

1️⃣ 打开Remix IDE：
   <button class="copy-btn" onclick="openRemix()">🌐 打开Remix</button>

2️⃣ 复制部署参数：
   <div class="params-box">${deployParams}</div>
   <button class="copy-btn" onclick="copyDeployParams()">📋 复制参数</button>

3️⃣ 在Remix中操作：
   • 创建文件：UltraSecureWheelGame.sol
   • 复制合约代码
   • 编译合约
   • 部署时粘贴上述参数

🔧 合约配置信息：
MAO代币: ${CONFIG.maoToken}
PI代币: ${CONFIG.piToken}
主管理员: ${CONFIG.trustedOwner}

🌐 网络设置：
网络名称: AlveyChain
链ID: 3797
RPC: https://elves-core2.alvey.io

📱 TP钱包操作：
1. 打开TP钱包
2. 点击"浏览器"
3. 输入: https://remix.ethereum.org
4. 按照上述步骤部署

<button class="copy-btn" onclick="copyAllInfo()">📋 复制所有信息</button>
            `;
            
            deployBtn.disabled = true;
        }

        function openRemix() {
            window.open('https://remix.ethereum.org', '_blank');
        }

        function copyDeployParams() {
            const params = `"${CONFIG.maoToken}","${CONFIG.piToken}",[${CONFIG.admins.map(addr => `"${addr}"`).join(',')}],"${CONFIG.trustedOwner}"`;
            navigator.clipboard.writeText(params).then(() => {
                alert('✅ 部署参数已复制到剪贴板！');
            });
        }

        function copyAllInfo() {
            const allInfo = `
🚀 MAO游戏部署信息

📋 部署参数：
"${CONFIG.maoToken}","${CONFIG.piToken}",[${CONFIG.admins.map(addr => `"${addr}"`).join(',')}],"${CONFIG.trustedOwner}"

🔧 合约配置：
MAO代币: ${CONFIG.maoToken}
PI代币: ${CONFIG.piToken}
主管理员: ${CONFIG.trustedOwner}

🌐 网络设置：
网络名称: AlveyChain
链ID: 3797
RPC: https://elves-core2.alvey.io

📱 操作步骤：
1. 打开TP钱包
2. 点击"浏览器"
3. 输入: https://remix.ethereum.org
4. 创建UltraSecureWheelGame.sol文件
5. 复制合约代码并编译
6. 部署时粘贴上述参数
            `;
            
            navigator.clipboard.writeText(allInfo).then(() => {
                alert('✅ 所有部署信息已复制到剪贴板！');
            });
        }
    </script>
</body>
</html>
