<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户验证测试系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .verification-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .verification-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #e74c3c;
        }
        
        .verification-card.verified {
            border-left-color: #27ae60;
        }
        
        .verification-card h3 {
            margin: 0 0 15px 0;
            color: #2c3e50;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e74c3c;
        }
        
        .status-indicator.verified {
            background: #27ae60;
        }
        
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        .btn:hover {
            background: #2980b9;
        }
        
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        
        .game-section {
            background: #ecf0f1;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .wheel {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                #ff6b6b 0deg 36deg,
                #4ecdc4 36deg 72deg,
                #45b7d1 72deg 108deg,
                #96ceb4 108deg 144deg,
                #feca57 144deg 180deg,
                #ff9ff3 180deg 216deg,
                #54a0ff 216deg 252deg,
                #5f27cd 252deg 288deg,
                #00d2d3 288deg 324deg,
                #ff9f43 324deg 360deg
            );
            margin: 20px auto;
            position: relative;
            transition: transform 3s ease;
        }
        
        .wheel.spinning {
            animation: spin 3s ease forwards;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(1800deg); }
        }
        
        .play-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 20px;
        }
        
        .play-btn:hover {
            background: #c0392b;
        }
        
        .play-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        
        .result-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .result-item {
            padding: 10px;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            justify-content: space-between;
        }
        
        .profit { color: #27ae60; font-weight: bold; }
        .loss { color: #e74c3c; font-weight: bold; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .stat-label {
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        .log {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 3px;
        }
        
        .log-success { background: rgba(39, 174, 96, 0.2); }
        .log-error { background: rgba(231, 76, 60, 0.2); }
        .log-info { background: rgba(52, 152, 219, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 用户验证测试系统</h1>
            <p>验证用户在真实参与游戏</p>
        </div>
        
        <div class="verification-grid">
            <div class="verification-card" id="walletCard">
                <div class="status">
                    <h3>钱包连接</h3>
                    <div class="status-indicator" id="walletStatus"></div>
                </div>
                <button class="btn" onclick="verifyWallet()">连接钱包</button>
                <div id="walletInfo">未连接</div>
            </div>
            
            <div class="verification-card" id="behaviorCard">
                <div class="status">
                    <h3>用户行为</h3>
                    <div class="status-indicator" id="behaviorStatus"></div>
                </div>
                <button class="btn" onclick="trackBehavior()">开始追踪</button>
                <div id="behaviorInfo">未追踪</div>
            </div>
            
            <div class="verification-card" id="deviceCard">
                <div class="status">
                    <h3>设备验证</h3>
                    <div class="status-indicator" id="deviceStatus"></div>
                </div>
                <button class="btn" onclick="verifyDevice()">验证设备</button>
                <div id="deviceInfo">未验证</div>
            </div>
            
            <div class="verification-card" id="timeCard">
                <div class="status">
                    <h3>时间验证</h3>
                    <div class="status-indicator" id="timeStatus"></div>
                </div>
                <button class="btn" onclick="verifyTime()">验证时间</button>
                <div id="timeInfo">未验证</div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalVerifications">0</div>
                <div class="stat-label">总验证项</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="passedVerifications">0</div>
                <div class="stat-label">通过验证</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="verificationRate">0%</div>
                <div class="stat-label">通过率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalGames">0</div>
                <div class="stat-label">游戏次数</div>
            </div>
        </div>
        
        <div class="game-section">
            <h2>🎲 游戏测试</h2>
            <div class="wheel" id="wheel"></div>
            <button class="play-btn" id="playBtn" onclick="playGame()" disabled>
                请先完成验证
            </button>
            <div class="result-section" id="resultSection" style="display: none;">
                <h3>游戏结果</h3>
                <div id="resultList"></div>
            </div>
        </div>
        
        <div class="log" id="log">
            <div class="log-entry log-info">系统启动</div>
        </div>
    </div>

    <script>
        const verificationStatus = {
            wallet: false,
            behavior: false,
            device: false,
            time: false
        };
        
        let userAddress = null;
        let behaviorData = [];
        let totalGames = 0;
        let totalWins = 0;
        let totalProfit = 0;
        
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        function updateVerificationStatus() {
            const total = Object.keys(verificationStatus).length;
            const passed = Object.values(verificationStatus).filter(Boolean).length;
            
            document.getElementById('totalVerifications').textContent = total;
            document.getElementById('passedVerifications').textContent = passed;
            document.getElementById('verificationRate').textContent = `${((passed / total) * 100).toFixed(0)}%`;
            
            if (passed === total) {
                document.getElementById('playBtn').disabled = false;
                document.getElementById('playBtn').textContent = '开始游戏';
                addLog('所有验证通过，游戏已启用', 'success');
            }
        }
        
        async function verifyWallet() {
            try {
                if (typeof window.ethereum !== 'undefined') {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = accounts[0];
                    
                    verificationStatus.wallet = true;
                    document.getElementById('walletStatus').classList.add('verified');
                    document.getElementById('walletCard').classList.add('verified');
                    document.getElementById('walletInfo').textContent = `${userAddress.substring(0, 6)}...${userAddress.substring(38)}`;
                    
                    addLog('钱包连接成功', 'success');
                    updateVerificationStatus();
                } else {
                    addLog('未检测到MetaMask', 'error');
                }
            } catch (error) {
                addLog('钱包连接失败', 'error');
            }
        }
        
        function trackBehavior() {
            let clickCount = 0;
            let moveCount = 0;
            
            const clickHandler = () => {
                clickCount++;
                behaviorData.push({
                    type: 'click',
                    timestamp: Date.now(),
                    position: { x: event.clientX, y: event.clientY }
                });
            };
            
            const moveHandler = () => {
                moveCount++;
            };
            
            document.addEventListener('click', clickHandler);
            document.addEventListener('mousemove', moveHandler);
            
            setTimeout(() => {
                document.removeEventListener('click', clickHandler);
                document.removeEventListener('mousemove', moveHandler);
                
                if (clickCount > 0 || moveCount > 50) {
                    verificationStatus.behavior = true;
                    document.getElementById('behaviorStatus').classList.add('verified');
                    document.getElementById('behaviorCard').classList.add('verified');
                    document.getElementById('behaviorInfo').textContent = `点击: ${clickCount}, 移动: ${moveCount}`;
                    addLog('用户行为验证通过', 'success');
                } else {
                    addLog('用户行为数据不足', 'error');
                }
                updateVerificationStatus();
            }, 5000);
            
            addLog('开始行为追踪...', 'info');
        }
        
        function verifyDevice() {
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenResolution: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
            
            const fingerprint = btoa(JSON.stringify(deviceInfo)).substring(0, 20);
            
            verificationStatus.device = true;
            document.getElementById('deviceStatus').classList.add('verified');
            document.getElementById('deviceCard').classList.add('verified');
            document.getElementById('deviceInfo').textContent = `指纹: ${fingerprint}...`;
            
            addLog('设备验证通过', 'success');
            updateVerificationStatus();
        }
        
        function verifyTime() {
            const now = new Date();
            const timeInfo = {
                hour: now.getHours(),
                minute: now.getMinutes(),
                dayOfWeek: now.getDay(),
                timestamp: now.getTime()
            };
            
            verificationStatus.time = true;
            document.getElementById('timeStatus').classList.add('verified');
            document.getElementById('timeCard').classList.add('verified');
            document.getElementById('timeInfo').textContent = now.toLocaleString();
            
            addLog('时间验证通过', 'success');
            updateVerificationStatus();
        }
        
        function playGame() {
            if (!Object.values(verificationStatus).every(Boolean)) {
                addLog('请先完成所有验证', 'error');
                return;
            }
            
            const wheel = document.getElementById('wheel');
            const playBtn = document.getElementById('playBtn');
            
            playBtn.disabled = true;
            playBtn.textContent = '游戏中...';
            wheel.classList.add('spinning');
            
            addLog('开始游戏...', 'info');
            
            setTimeout(() => {
                const result = simulateGame();
                wheel.classList.remove('spinning');
                
                displayResult(result);
                updateStats(result);
                
                playBtn.disabled = false;
                playBtn.textContent = '开始游戏';
                
                addLog(`游戏结果: ${result.isWin ? '中奖' : '未中奖'}`, result.isWin ? 'success' : 'info');
            }, 3000);
        }
        
        function simulateGame() {
            const random = Math.random() * 100;
            
            if (random < 50) {
                const rewards = [
                    { name: "特等奖", amount: 10000, prob: 0.1 },
                    { name: "一等奖", amount: 2000, prob: 0.5 },
                    { name: "二等奖", amount: 500, prob: 2 },
                    { name: "三等奖", amount: 200, prob: 5 },
                    { name: "四等奖", amount: 110, prob: 15 },
                    { name: "安慰奖", amount: 101, prob: 27.4 }
                ];
                
                let cumulativeProb = 0;
                for (let reward of rewards) {
                    cumulativeProb += reward.prob;
                    if (random < cumulativeProb) {
                        return {
                            isWin: true,
                            level: reward.name,
                            amount: reward.amount,
                            profit: reward.amount - 100
                        };
                    }
                }
            }
            
            return {
                isWin: false,
                level: "未中奖",
                amount: 0,
                profit: -100
            };
        }
        
        function displayResult(result) {
            const resultSection = document.getElementById('resultSection');
            const resultList = document.getElementById('resultList');
            
            const resultItem = document.createElement('div');
            resultItem.className = 'result-item';
            
            const profitClass = result.profit >= 0 ? 'profit' : 'loss';
            const profitText = result.profit >= 0 ? `+${result.profit}` : result.profit;
            
            resultItem.innerHTML = `
                <div>
                    <strong>${result.level}</strong> - ${new Date().toLocaleTimeString()}
                </div>
                <div class="${profitClass}">
                    ${result.isWin ? `获得 ${result.amount} MAO` : '未中奖'} (${profitText} MAO)
                </div>
            `;
            
            resultList.insertBefore(resultItem, resultList.firstChild);
            resultSection.style.display = 'block';
            
            if (resultList.children.length > 10) {
                resultList.removeChild(resultList.lastChild);
            }
        }
        
        function updateStats(result) {
            totalGames++;
            if (result.isWin) {
                totalWins++;
                totalProfit += result.profit;
            } else {
                totalProfit += result.profit;
            }
            
            document.getElementById('totalGames').textContent = totalGames;
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            addLog('用户验证测试系统已启动', 'info');
            updateVerificationStatus();
        });
    </script>
</body>
</html>
