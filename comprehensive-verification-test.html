<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 综合用户验证测试系统</title>
    <script src="real-time-monitor.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 1.2em;
        }
        
        .verification-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .verification-card {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .verification-card:hover {
            transform: translateY(-5px);
        }
        
        .verification-card.verified {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-left: 4px solid #27ae60;
        }
        
        .verification-card h3 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            font-size: 1.3em;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .status-indicator {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #e74c3c;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .status-indicator.verified {
            background: #27ae60;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            font-size: 0.9em;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn.success {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }
        
        .info-text {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 5px;
        }
        
        .game-section {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .game-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .wheel-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
        
        .wheel {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: conic-gradient(
                #ff6b6b 0deg 36deg,
                #4ecdc4 36deg 72deg,
                #45b7d1 72deg 108deg,
                #96ceb4 108deg 144deg,
                #feca57 144deg 180deg,
                #ff9ff3 180deg 216deg,
                #54a0ff 216deg 252deg,
                #5f27cd 252deg 288deg,
                #00d2d3 288deg 324deg,
                #ff9f43 324deg 360deg
            );
            margin: 20px auto;
            position: relative;
            transition: transform 3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .wheel.spinning {
            animation: spin 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(1800deg); }
        }
        
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #e74c3c;
            z-index: 10;
        }
        
        .play-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .play-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }
        
        .play-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .result-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .result-item {
            padding: 15px;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }
        
        .result-item:hover {
            background: #f8f9fa;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .profit {
            color: #27ae60;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .loss {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #7f8c8d;
            font-size: 1em;
            font-weight: bold;
        }
        
        .log {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 5px;
            border-left: 3px solid transparent;
        }
        
        .log-success { 
            background: rgba(39, 174, 96, 0.2); 
            border-left-color: #27ae60;
        }
        
        .log-error { 
            background: rgba(231, 76, 60, 0.2); 
            border-left-color: #e74c3c;
        }
        
        .log-info { 
            background: rgba(52, 152, 219, 0.2); 
            border-left-color: #3498db;
        }
        
        .log-warning { 
            background: rgba(243, 156, 18, 0.2); 
            border-left-color: #f39c12;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        @media (max-width: 768px) {
            .verification-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .wheel {
                width: 200px;
                height: 200px;
            }
            
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 综合用户验证测试系统</h1>
            <p>多重验证机制确保用户在真实参与游戏</p>
        </div>
        
        <div class="verification-grid">
            <div class="verification-card" id="walletCard">
                <div class="status">
                    <h3>🔐 钱包连接验证</h3>
                    <div class="status-indicator" id="walletStatus"></div>
                </div>
                <button class="btn" onclick="verifyWallet()">连接钱包</button>
                <div class="info-text" id="walletInfo">请连接MetaMask钱包进行身份验证</div>
            </div>
            
            <div class="verification-card" id="behaviorCard">
                <div class="status">
                    <h3>🎭 用户行为追踪</h3>
                    <div class="status-indicator" id="behaviorStatus"></div>
                </div>
                <button class="btn" onclick="startBehaviorTracking()">开始追踪</button>
                <div class="info-text" id="behaviorInfo">追踪鼠标移动、点击等用户行为</div>
            </div>
            
            <div class="verification-card" id="deviceCard">
                <div class="status">
                    <h3>📱 设备指纹验证</h3>
                    <div class="status-indicator" id="deviceStatus"></div>
                </div>
                <button class="btn" onclick="verifyDevice()">验证设备</button>
                <div class="info-text" id="deviceInfo">收集设备信息生成唯一指纹</div>
            </div>
            
            <div class="verification-card" id="timeCard">
                <div class="status">
                    <h3>⏰ 时间模式验证</h3>
                    <div class="status-indicator" id="timeStatus"></div>
                </div>
                <button class="btn" onclick="verifyTimePattern()">验证时间</button>
                <div class="info-text" id="timeInfo">分析操作时间间隔模式</div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalVerifications">4</div>
                <div class="stat-label">总验证项</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="passedVerifications">0</div>
                <div class="stat-label">通过验证</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="verificationRate">0%</div>
                <div class="stat-label">验证通过率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalGames">0</div>
                <div class="stat-label">游戏次数</div>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        
        <div class="game-section">
            <h2>🎲 真实游戏测试</h2>
            <p>完成所有验证后即可进行真实游戏测试</p>
            
            <div class="wheel-container">
                <div class="wheel" id="wheel">
                    <div class="wheel-pointer"></div>
                </div>
            </div>
            
            <button class="play-btn" id="playBtn" onclick="playGame()" disabled>
                请先完成所有验证
            </button>
            
            <div class="result-section" id="resultSection" style="display: none;">
                <h3>🎮 游戏结果</h3>
                <div id="resultList"></div>
            </div>
        </div>
        
        <div class="log" id="log">
            <div class="log-entry log-info">🚀 综合验证测试系统已启动</div>
        </div>
    </div>

    <script>
        let monitor = null;
        let totalGames = 0;
        let totalWins = 0;
        let totalProfit = 0;
        
        // 初始化监控器
        document.addEventListener('DOMContentLoaded', function() {
            monitor = new UserBehaviorMonitor();
            addLog('🎯 用户行为监控器已初始化', 'info');
        });
        
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        function updateProgress() {
            const status = monitor ? monitor.getVerificationStatus() : {};
            const passedCount = Object.values(status).filter(Boolean).length;
            const totalCount = Object.keys(status).length;
            const progress = (passedCount / totalCount) * 100;
            
            document.getElementById('passedVerifications').textContent = passedCount;
            document.getElementById('verificationRate').textContent = `${progress.toFixed(0)}%`;
            document.getElementById('progressFill').style.width = `${progress}%`;
            
            if (progress === 100) {
                document.getElementById('playBtn').disabled = false;
                document.getElementById('playBtn').textContent = '🎮 开始游戏';
                addLog('🎉 所有验证完成，游戏已启用！', 'success');
            }
        }
        
        async function verifyWallet() {
            if (!monitor) return;
            
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '连接中...';
            
            try {
                const success = await monitor.verifyWallet();
                if (success) {
                    document.getElementById('walletStatus').classList.add('verified');
                    document.getElementById('walletCard').classList.add('verified');
                    document.getElementById('walletInfo').textContent = `钱包地址: ${monitor.userData.walletAddress.substring(0, 6)}...${monitor.userData.walletAddress.substring(38)}`;
                    btn.classList.add('success');
                    btn.textContent = '✅ 已连接';
                    addLog('✅ 钱包连接验证成功', 'success');
                } else {
                    btn.disabled = false;
                    btn.textContent = '重试连接';
                    addLog('❌ 钱包连接失败', 'error');
                }
            } catch (error) {
                btn.disabled = false;
                btn.textContent = '重试连接';
                addLog('❌ 钱包连接错误: ' + error.message, 'error');
            }
            
            updateProgress();
        }
        
        function startBehaviorTracking() {
            if (!monitor) return;
            
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '追踪中...';
            
            monitor.startMonitoring();
            
            setTimeout(() => {
                const success = monitor.verifyBehavior();
                if (success) {
                    document.getElementById('behaviorStatus').classList.add('verified');
                    document.getElementById('behaviorCard').classList.add('verified');
                    btn.classList.add('success');
                    btn.textContent = '✅ 已追踪';
                    addLog('✅ 用户行为验证成功', 'success');
                } else {
                    btn.disabled = false;
                    btn.textContent = '重新追踪';
                    addLog('⚠️ 行为数据不足，请继续操作', 'warning');
                }
                updateProgress();
            }, 5000);
            
            addLog('🎭 开始用户行为追踪...', 'info');
        }
        
        function verifyDevice() {
            if (!monitor) return;
            
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '验证中...';
            
            setTimeout(() => {
                const success = monitor.verifyDevice();
                if (success) {
                    document.getElementById('deviceStatus').classList.add('verified');
                    document.getElementById('deviceCard').classList.add('verified');
                    document.getElementById('deviceInfo').textContent = `设备指纹: ${btoa(JSON.stringify(monitor.userData.deviceInfo)).substring(0, 20)}...`;
                    btn.classList.add('success');
                    btn.textContent = '✅ 已验证';
                    addLog('✅ 设备指纹验证成功', 'success');
                } else {
                    btn.disabled = false;
                    btn.textContent = '重新验证';
                    addLog('❌ 设备验证失败', 'error');
                }
                updateProgress();
            }, 1000);
        }
        
        function verifyTimePattern() {
            if (!monitor) return;
            
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '分析中...';
            
            setTimeout(() => {
                const success = monitor.verifyTimePattern();
                if (success) {
                    document.getElementById('timeStatus').classList.add('verified');
                    document.getElementById('timeCard').classList.add('verified');
                    document.getElementById('timeInfo').textContent = `时间模式: ${new Date().toLocaleString()}`;
                    btn.classList.add('success');
                    btn.textContent = '✅ 已分析';
                    addLog('✅ 时间模式验证成功', 'success');
                } else {
                    btn.disabled = false;
                    btn.textContent = '重新分析';
                    addLog('⚠️ 时间数据不足', 'warning');
                }
                updateProgress();
            }, 2000);
        }
        
        function playGame() {
            if (!monitor) return;
            
            const status = monitor.getVerificationStatus();
            if (!Object.values(status).every(Boolean)) {
                addLog('❌ 请先完成所有验证', 'error');
                return;
            }
            
            const wheel = document.getElementById('wheel');
            const playBtn = document.getElementById('playBtn');
            
            playBtn.disabled = true;
            playBtn.textContent = '🎲 游戏中...';
            wheel.classList.add('spinning');
            
            addLog('🎮 开始游戏...', 'info');
            
            setTimeout(() => {
                const result = simulateGame();
                wheel.classList.remove('spinning');
                
                displayResult(result);
                updateGameStats(result);
                
                // 记录游戏事件
                monitor.recordGameEvent(result);
                
                playBtn.disabled = false;
                playBtn.textContent = '🎮 开始游戏';
                
                addLog(`🎯 游戏结果: ${result.isWin ? '🎉 中奖' : '😔 未中奖'}`, result.isWin ? 'success' : 'info');
            }, 3000);
        }
        
        function simulateGame() {
            const random = Math.random() * 100;
            
            if (random < 50) {
                const rewards = [
                    { name: "🏆 特等奖", amount: 10000, prob: 0.1 },
                    { name: "🥇 一等奖", amount: 2000, prob: 0.5 },
                    { name: "🥈 二等奖", amount: 500, prob: 2 },
                    { name: "🥉 三等奖", amount: 200, prob: 5 },
                    { name: "🎁 四等奖", amount: 110, prob: 15 },
                    { name: "🎪 安慰奖", amount: 101, prob: 27.4 }
                ];
                
                let cumulativeProb = 0;
                for (let reward of rewards) {
                    cumulativeProb += reward.prob;
                    if (random < cumulativeProb) {
                        return {
                            isWin: true,
                            level: reward.name,
                            amount: reward.amount,
                            profit: reward.amount - 100
                        };
                    }
                }
            }
            
            return {
                isWin: false,
                level: "😔 未中奖",
                amount: 0,
                profit: -100
            };
        }
        
        function displayResult(result) {
            const resultSection = document.getElementById('resultSection');
            const resultList = document.getElementById('resultList');
            
            const resultItem = document.createElement('div');
            resultItem.className = 'result-item';
            
            const profitClass = result.profit >= 0 ? 'profit' : 'loss';
            const profitText = result.profit >= 0 ? `+${result.profit}` : result.profit;
            
            resultItem.innerHTML = `
                <div>
                    <strong>${result.level}</strong> - ${new Date().toLocaleTimeString()}
                </div>
                <div class="${profitClass}">
                    ${result.isWin ? `获得 ${result.amount} MAO` : '未中奖'} (${profitText} MAO)
                </div>
            `;
            
            resultList.insertBefore(resultItem, resultList.firstChild);
            resultSection.style.display = 'block';
            
            if (resultList.children.length > 10) {
                resultList.removeChild(resultList.lastChild);
            }
        }
        
        function updateGameStats(result) {
            totalGames++;
            if (result.isWin) {
                totalWins++;
                totalProfit += result.profit;
            } else {
                totalProfit += result.profit;
            }
            
            document.getElementById('totalGames').textContent = totalGames;
        }
        
        // 定期更新进度
        setInterval(updateProgress, 1000);
    </script>
</body>
</html>
