<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 添加AlveyChain网络</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .network-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            width: 100%;
            margin: 20px 0;
        }
        .network-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
        }
        .info-box {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            border: 1px solid rgba(255,255,255,0.3);
            font-size: 14px;
            text-align: left;
        }
        .copy-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .instructions {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 添加AlveyChain网络</h1>
        
        <div class="instructions">
            <strong>📱 选择你的钱包类型：</strong><br>
            点击下方按钮自动添加AlveyChain网络到你的钱包
        </div>
        
        <button class="network-btn" onclick="addAlveyChain()">
            🌐 自动添加AlveyChain网络
        </button>
        
        <div class="info-box">
🌐 AlveyChain网络信息：

网络名称: AlveyChain
RPC URL: https://elves-core2.alvey.io
链ID: 3797
代币符号: ALV
区块浏览器: https://alveyscan.com

📋 手动添加步骤：
1. 打开钱包设置
2. 点击"网络管理"
3. 点击"添加网络"
4. 输入上述信息
5. 保存并切换网络
        </div>
        
        <button class="copy-btn" onclick="copyNetworkInfo()">📋 复制网络信息</button>
        <button class="copy-btn" onclick="openRemix()">🚀 打开Remix部署</button>
    </div>

    <script>
        async function addAlveyChain() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: '0xED5', // 3797 in hex
                            chainName: 'AlveyChain',
                            nativeCurrency: {
                                name: 'ALV',
                                symbol: 'ALV',
                                decimals: 18
                            },
                            rpcUrls: ['https://elves-core2.alvey.io'],
                            blockExplorerUrls: ['https://alveyscan.com']
                        }]
                    });
                    alert('✅ AlveyChain网络已成功添加到钱包！');
                } catch (error) {
                    console.error('添加网络失败:', error);
                    alert('❌ 添加网络失败，请手动添加网络信息');
                }
            } else {
                alert('❌ 未检测到钱包，请确保钱包已连接');
            }
        }

        function copyNetworkInfo() {
            const networkInfo = `
AlveyChain网络信息：

网络名称: AlveyChain
RPC URL: https://elves-core2.alvey.io
链ID: 3797
代币符号: ALV
区块浏览器: https://alveyscan.com
            `;
            
            navigator.clipboard.writeText(networkInfo).then(() => {
                alert('✅ 网络信息已复制到剪贴板！');
            });
        }

        function openRemix() {
            window.open('https://remix.ethereum.org', '_blank');
        }
    </script>
</body>
</html>
